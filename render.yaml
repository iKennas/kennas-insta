# https://render.com/deploy?repo=https://github.com/iKennas/kennas-insta
services:
  - type: web
    name: kennas-insta-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
